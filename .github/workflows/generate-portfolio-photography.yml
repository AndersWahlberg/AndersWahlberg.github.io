name: Generate portfolio photography

on:
  push:
    paths:
      - '.github/workflows/generate-portfolio-photography.yml'
      - 'assets/anders-foto.jpg.jpg'
      - 'assets/jkorsimophoto-K&A-364.jpg'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Generate responsive WebP assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('assets')

          portrait_source = Image.open(assets / 'jkorsimophoto-K&A-364.jpg').convert('RGB')
          portrait = portrait_source.crop((1200, 650, 4200, 5150))
          for width, height in ((640, 960), (960, 1440), (1440, 2160)):
              out = assets / f'anders-portrait-{width}.webp'
              portrait.resize((width, height), Image.Resampling.LANCZOS).save(
                  out, 'WEBP', quality=88, method=6
              )

          landscape = Image.open(assets / 'anders-foto.jpg.jpg').convert('RGB')
          for width, height in ((640, 427), (960, 640), (1440, 960), (2080, 1387)):
              out = assets / f'anders-landscape-{width}.webp'
              landscape.resize((width, height), Image.Resampling.LANCZOS).save(
                  out, 'WEBP', quality=88, method=6
              )
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anders-portrait-*.webp assets/anders-landscape-*.webp
          if git diff --cached --quiet; then
            echo "Generated assets already match the repository."
          else
            git commit -m "Generate optimized portfolio photography assets"
            git push
          fi
